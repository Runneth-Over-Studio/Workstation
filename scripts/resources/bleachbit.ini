# BleachBit defaults written by mint-general-setup.sh (an existing file is backed up first).
# Conservative on purpose; adjust later via BleachBit → Preferences.

[bleachbit]
shred = False
delete_confirmation = True
# APT keeps BleachBit up to date.
check_online_updates = False

# Pre-selected cleaners, as <cleaner>.<option>. Browser and package-manager
# cleaners are intentionally left unselected.
[tree]
system.cache = True
system.tmp = True
system.trash = True
thumbnails.cache = True
